name: Integrate verified source edits
on:
  push:
    branches: ['improve/climber-knowledge-20260911']
    paths: ['.integration/edit-bundle.json', '.github/workflows/integrate.yml']
permissions:
  contents: write
concurrency:
  group: crux-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Matsu71/Climbing_Blog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply exact checked source edits without overwriting concurrent work
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import json, hashlib
          root = Path.cwd()
          bundle = json.loads(Path('.integration/edit-bundle.json').read_text())
          staged = {}
          allowed = {'src', 'public', 'data', 'scripts', 'tests', 'project-docs'}
          for entry in bundle.get('edits', []) + bundle.get('files', []):
              name = entry['path']
              p = PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or not p.parts or (p.parts[0] not in allowed and name not in {'README.md', 'package.json', '.gitignore'}):
                  raise ValueError('Path not permitted: ' + name)
              target = root / name
              if name in staged or target.is_symlink() or root not in target.resolve().parents:
                  raise ValueError('Invalid or duplicate target: ' + name)
              old = target.read_bytes() if target.exists() else None
              actual = hashlib.sha256(old).hexdigest() if old is not None else None
              if actual != entry.get('before'):
                  raise ValueError('Source changed; refusing stale edit: ' + name)
              if 'content' in entry:
                  content = entry['content']
              else:
                  content = old.decode('utf-8')
                  for change in entry['replacements']:
                      if content.count(change['old']) != change['count']:
                          raise ValueError('Replacement count mismatch: ' + name)
                      content = content.replace(change['old'], change['new'])
              data = content.encode('utf-8')
              if hashlib.sha256(data).hexdigest() != entry['after']:
                  raise ValueError('Output checksum mismatch: ' + name)
              staged[name] = data
          if not staged:
              raise ValueError('Empty source edit bundle')
          for name, data in staged.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          Path('artifacts/changed-files.json').write_text(json.dumps(list(staged)))
          Path('artifacts/source-hashes.json').write_text(json.dumps({k:hashlib.sha256(v).hexdigest() for k,v in staged.items()}, indent=2))
          PY
          git diff --binary > artifacts/applied-source.diff
      - name: Verify data, calculations, build and internal links
        run: |
          set -o pipefail
          npm run check 2>&1 | tee artifacts/node-checks.log
      - name: Install Chromium verification tools
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual browser interactions and mobile layout
        run: |
          set -o pipefail
          python tests/browser_smoke.py 2>&1 | tee artifacts/browser-checks.log
      - name: Commit tested files only and fast-forward the improvement branch
        run: |
          python - <<'PY'
          import json, subprocess
          names = json.load(open('artifacts/changed-files.json'))
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git rm .integration/edit-bundle.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate source edits after passing unit, link and Chromium checks'
          git push origin HEAD:refs/heads/improve/climber-knowledge-20260911
          git rev-parse HEAD > artifacts/commit.txt
          git archive --format=zip HEAD -o artifacts/source.zip
      - name: Retain complete verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crux-integration-${{ github.sha }}
          path: |
            artifacts/
            dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
