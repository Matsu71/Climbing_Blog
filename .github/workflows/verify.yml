name: Verify CRUX
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crux-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Preserve exact source snapshot
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/source.zip
          git rev-parse HEAD > artifacts/commit.txt
      - name: Unit tests, static build and internal-link audit
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee artifacts/node-checks.log
      - name: Install browser verification tools
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Real Chromium interaction and mobile checks
        shell: bash
        run: |
          set -o pipefail
          python tests/browser_smoke.py 2>&1 | tee artifacts/browser-checks.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crux-verification-${{ github.sha }}
          path: |
            artifacts/
            dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
