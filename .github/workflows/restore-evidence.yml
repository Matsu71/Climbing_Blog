name: Restore and verify saved evidence
on:
  push:
    branches: ['improve/evidence-20260914-f']
    paths: ['.source-update/restore-*.b64', '.github/workflows/restore-evidence.yml']
permissions:
  contents: write
concurrency:
  group: crux-restore-saved-evidence
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'Matsu71/Climbing_Blog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Restore exact saved batch and verify source tree
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='9639a2abec15f3a1098e249cc856a42e04eadc3b'
          parts=[Path(f'.source-update/restore-{i}.b64') for i in range(5)]
          data=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(data).hexdigest()=='68d65f4b93a7c4c97a777e644e0afc60766420a6f80c8b9d354350584867866f'
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='73173f6009a840e580a969bc5674430665e92a8b8e97aac7e9fd2d0558fc0ce7'
          Path('artifacts/restored.patch').write_bytes(patch)
          subprocess.run(['git','rm','--',*[str(p) for p in parts],'.github/workflows/restore-evidence.yml'],check=True)
          subprocess.run(['git','apply','--check','artifacts/restored.patch'],check=True)
          subprocess.run(['git','apply','--index','artifacts/restored.patch'],check=True)
          tree=git('write-tree')
          assert tree=='584aadf95c0260083884de606274fc7f0cbaa0da',tree
          Path('artifacts/restored-tree.txt').write_text(tree+'\n')
          PY
      - name: Unit tests, static build and link audit
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee artifacts/node-checks.log
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee artifacts/publishing-tests.log
      - name: Install browser verification tools
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium webkit
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Chromium interaction and responsive checks
        shell: bash
        run: |
          set -o pipefail
          python tests/browser_smoke.py 2>&1 | tee artifacts/browser-checks.log
      - name: WebKit interaction and responsive checks
        shell: bash
        run: |
          set -o pipefail
          python tests/webkit_smoke.py 2>&1 | tee artifacts/webkit-checks.log
      - name: Save only the verified source on the candidate branch
        run: |
          test "$(git write-tree)" = '584aadf95c0260083884de606274fc7f0cbaa0da'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore saved batch five after source checksum and browser verification'
          git push origin HEAD:refs/heads/improve/evidence-20260914-f
          git rev-parse HEAD > artifacts/commit.txt
          git archive --format=zip HEAD -o artifacts/source.zip
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crux-restored-evidence-${{ github.sha }}
          path: |
            artifacts/
            dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
